<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Para ti, Brehilis 🌙</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: radial-gradient(ellipse at bottom, #0d1b2a 0%, #000000 100%);
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    .stars {
      width: 2px;
      height: 2px;
      background: white;
      position: absolute;
      border-radius: 50%;
      animation: twinkle 2s infinite ease-in-out alternate;
    }

    @keyframes twinkle {
      from { opacity: 0.2; transform: scale(1); }
      to { opacity: 1; transform: scale(1.3); }
    }

    .card {
      background-color: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(6px);
      border-radius: 16px;
      padding: 24px;
      max-width: 350px;
      text-align: center;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
    }

    .button {
      background-color: #ffffff22;
      color: #fff;
      border: 1px solid #ffffff44;
      padding: 10px 20px;
      font-size: 16px;
      margin-top: 16px;
      border-radius: 8px;
      cursor: pointer;
    }

    .message {
      opacity: 0;
      transition: opacity 2s ease;
      margin-top: 20px;
      font-size: 15px;
    }

    .message.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>🌙 Para ti, Brehilis</h2>
    <button class="button" onclick="mostrarMensaje()">Ver mensaje</button>
    <div id="mensaje" class="message">
      No quería que la noche cerrara sin enviarte algo…<br/><br/>
      Hoy me quedó grabada tu sonrisa, tus gestos, todo lo que haces sin darte cuenta.<br/>
      Solo quería que supieras: me gusta cómo eres, me gusta cómo me haces sentir.<br/>
      Dormí bonito, Brehilis. Esta noche te pienso con cariño. 🌌
    </div>
  </div>

  <script>
    function mostrarMensaje() {
      document.getElementById("mensaje").classList.add("show");
    }

    // Generar estrellas
    for (let i = 0; i < 80; i++) {
      const star = document.createElement('div');
      star.className = 'stars';
      star.style.top = Math.random() * window.innerHeight + 'px';
      star.style.left = Math.random() * window.innerWidth + 'px';
      star.style.animationDuration = (Math.random() * 2 + 1) + 's';
      document.body.appendChild(star);
    }
  </script>
</body>
</html>
